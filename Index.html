<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天的幸運轉盤</title>
<style>
  :root {
    --bg-1: #ffe3ee;
    --bg-2: #fff4cf;
    --bg-3: #d3ecff;
    --ink: #5b3a4e;
    --ink-soft: #8a6a7c;
    --rim-1: #fff6d8;
    --rim-2: #ffd98a;
    --rim-3: #f2b25c;
    --bulb: #fffdf2;
    --btn-1: #ff9db9;
    --btn-2: #ff6f9c;
    --btn-edge: #d4507f;
    --btn-glow: rgba(255, 111, 156, .45);
    --card-bg: #fffaf0;
    --card-edge: #ffe1a8;
    --overlay: rgba(110, 70, 100, .38);
    --shadow: rgba(150, 90, 120, .30);
    --cloud: rgba(255, 255, 255, .85);
    --disabled: #d9b9c6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #3b2540;
      --bg-2: #3d3550;
      --bg-3: #23386a;
      --ink: #ffeaf3;
      --ink-soft: #d9b8cc;
      --card-bg: #4a3354;
      --card-edge: #7a5a86;
      --overlay: rgba(10, 5, 25, .6);
      --shadow: rgba(0, 0, 0, .45);
      --cloud: rgba(255, 255, 255, .14);
      --disabled: #8a6a7c;
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #3b2540;
    --bg-2: #3d3550;
    --bg-3: #23386a;
    --ink: #ffeaf3;
    --ink-soft: #d9b8cc;
    --card-bg: #4a3354;
    --card-edge: #7a5a86;
    --overlay: rgba(10, 5, 25, .6);
    --shadow: rgba(0, 0, 0, .45);
    --cloud: rgba(255, 255, 255, .14);
    --disabled: #8a6a7c;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3.2vh, 28px);
    padding: 18px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background: linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 背景雲朵與星星 */
  .deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .cloud {
    position: absolute;
    width: 120px; height: 38px;
    background: var(--cloud);
    border-radius: 40px;
    filter: blur(.3px);
    animation: drift 26s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
  .cloud::after  { width: 40px; height: 40px; left: 58px; top: -18px; }
  .cloud.c1 { top: 9%;  left: -140px; }
  .cloud.c2 { top: 72%; left: -140px; animation-duration: 34s; animation-delay: -12s; transform: scale(.8); }
  .cloud.c3 { top: 38%; left: -140px; animation-duration: 40s; animation-delay: -26s; transform: scale(.6); }
  @keyframes drift { to { translate: calc(100vw + 300px) 0; } }
  .spark {
    position: absolute; font-size: 18px; opacity: .8;
    animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .25; transform: scale(.7) rotate(20deg); } }

  main {
    position: relative; z-index: 1;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(14px, 3.2vh, 28px);
  }

  h1 {
    margin: 0;
    font-size: clamp(26px, 7.4vw, 38px);
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--ink);
    text-align: center;
    text-shadow: 0 2px 0 #fff8, 0 4px 10px var(--shadow);
  }
  .sub { margin: -8px 0 0; font-size: clamp(14px, 3.8vw, 17px); color: var(--ink-soft); text-align: center; }

  /* 轉盤 */
  .stage {
    position: relative;
    width: min(88vw, 50vh, 420px);
    aspect-ratio: 1;
  }
  .stage::after { /* 地面陰影 */
    content: ""; position: absolute; left: 12%; right: 12%; bottom: -5%; height: 8%;
    background: radial-gradient(closest-side, var(--shadow), transparent);
    filter: blur(4px); z-index: 0;
  }
  .rim {
    position: absolute; inset: 0; border-radius: 50%; z-index: 1;
    background:
      radial-gradient(circle at 32% 24%, var(--rim-1), var(--rim-2) 48%, var(--rim-3) 100%);
    box-shadow:
      0 14px 0 #e29a45,
      0 22px 30px var(--shadow),
      inset 0 -6px 12px rgba(180, 100, 30, .35),
      inset 0 6px 10px rgba(255, 255, 255, .8);
  }
  .wheel {
    position: absolute; inset: 5.6%; border-radius: 50%; z-index: 2;
    transform: rotate(0deg);
    will-change: transform;
    box-shadow: inset 0 0 0 3px #fff9, 0 0 0 3px #fff7;
  }
  .wheel svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .gloss { /* 立體高光 */
    position: absolute; inset: 5.6%; border-radius: 50%; z-index: 3; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 38% at 36% 22%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(circle at 50% 50%, transparent 62%, rgba(120, 60, 90, .16) 100%);
  }
  .bulbs { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .bulbs i {
    position: absolute; width: 3.4%; height: 3.4%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--bulb) 40%, #ffe29a);
    box-shadow: 0 0 6px 1px #fff7c2, 0 1px 2px rgba(150, 90, 20, .5);
    animation: bulb 1.2s steps(1) infinite;
  }
  .bulbs i:nth-child(even) { animation-delay: -.6s; }
  @keyframes bulb { 50% { opacity: .45; box-shadow: 0 0 2px 0 #fff7c2, 0 1px 2px rgba(150, 90, 20, .5); } }
  .stage.spinning .bulbs i { animation-duration: .35s; }

  /* 指針 */
  .pointer {
    position: absolute; left: 50%; top: -3.5%; z-index: 6;
    width: 13%; aspect-ratio: .8;
    transform: translateX(-50%);
    transform-origin: 50% 20%;
    filter: drop-shadow(0 5px 3px rgba(120, 50, 80, .4));
  }
  .pointer svg { width: 100%; height: 100%; display: block; }
  .stage.spinning .pointer { animation: tick .14s ease-in-out infinite; }
  @keyframes tick { 50% { transform: translateX(-50%) rotate(-9deg); } }

  /* 中心按鈕 */
  .hub {
    position: absolute; left: 50%; top: 50%; z-index: 5;
    width: 24%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 0; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 34% 28%, #fff, #ffe9f1 45%, #ffbfd4 100%);
    box-shadow: 0 6px 0 #e58aa8, 0 10px 14px var(--shadow), inset 0 2px 4px #fff;
    display: grid; place-items: center;
    font-size: clamp(20px, 6vw, 30px);
    transition: transform .12s, box-shadow .12s;
  }
  .hub:active { transform: translate(-50%, calc(-50% + 4px)); box-shadow: 0 2px 0 #e58aa8, 0 4px 8px var(--shadow), inset 0 2px 4px #fff; }
  .hub:focus-visible, .go:focus-visible, .again:focus-visible { outline: 4px solid #5aa9ff; outline-offset: 4px; }

  /* 開始按鈕 */
  .go, .again {
    font: inherit;
    font-weight: 900;
    letter-spacing: .12em;
    color: #fff;
    border: 0; cursor: pointer;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--btn-1), var(--btn-2));
    box-shadow: 0 8px 0 var(--btn-edge), 0 14px 22px var(--btn-glow), inset 0 3px 3px rgba(255, 255, 255, .55);
    text-shadow: 0 2px 0 rgba(160, 40, 90, .45);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .go { font-size: clamp(20px, 5.8vw, 26px); padding: 15px 44px; min-width: 220px; }
  .go:not(:disabled) { animation: bounce 2.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-4px); } }
  .go:active:not(:disabled), .again:active {
    transform: translateY(6px);
    animation: none;
    box-shadow: 0 2px 0 var(--btn-edge), 0 6px 10px var(--btn-glow), inset 0 3px 3px rgba(255, 255, 255, .55);
  }
  .go:disabled {
    cursor: default;
    background: linear-gradient(180deg, #e8cdd8, var(--disabled));
    box-shadow: 0 4px 0 #b894a5, 0 8px 12px var(--shadow), inset 0 3px 3px rgba(255, 255, 255, .5);
    transform: translateY(4px);
    filter: saturate(.8);
  }
  .count { margin: -6px 0 0; min-height: 1.4em; font-size: 15px; color: var(--ink-soft); }

  /* 結果卡片 */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--overlay);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden;
    transition: opacity .25s, visibility .25s;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .card {
    position: relative;
    width: min(100%, 360px);
    padding: 30px 24px 26px;
    text-align: center;
    background: var(--card-bg);
    border-radius: 32px;
    border: 4px solid var(--card-edge);
    box-shadow: 0 10px 0 var(--card-edge), 0 26px 40px var(--shadow), inset 0 3px 0 #fff9;
    transform: scale(.6) rotate(-4deg);
    opacity: 0;
    transition: transform .45s cubic-bezier(.2, 1.5, .4, 1), opacity .25s;
  }
  .overlay.show .card { transform: none; opacity: 1; }
  .badge {
    display: inline-block; margin-bottom: 8px; padding: 4px 16px;
    border-radius: 999px; font-size: 15px; font-weight: 700; color: #fff;
    background: var(--tint, #ff8fb1);
    box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
  }
  .emoji { font-size: 76px; line-height: 1.1; filter: drop-shadow(0 6px 4px var(--shadow)); animation: pop 1.6s ease-in-out infinite; }
  @keyframes pop { 50% { transform: translateY(-6px) scale(1.06); } }
  .msg { margin: 10px 0 22px; font-size: clamp(22px, 6.4vw, 28px); font-weight: 900; line-height: 1.4; color: var(--ink); }
  .again { font-size: 20px; padding: 13px 34px; }

  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
  .confetti span {
    position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(520px) rotate(540deg); opacity: .2; } }

  @media (max-height: 640px) {
    .sub { display: none; }
    .stage { width: min(80vw, 46vh, 420px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .spark, .bulbs i, .go, .emoji { animation: none !important; }
    .stage.spinning .pointer { animation: none; }
  }
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <span class="spark" style="top:8%;left:12%">✨</span>
  <span class="spark" style="top:16%;right:10%;animation-delay:-1s">⭐</span>
  <span class="spark" style="bottom:12%;left:9%;animation-delay:-2s">💖</span>
  <span class="spark" style="bottom:20%;right:8%;animation-delay:-.5s">✨</span>
</div>

<main>
  <h1>🎡 今天的幸運轉盤</h1>
  <p class="sub">轉一轉，看看今天的好運在哪裡</p>

  <div class="stage" id="stage">
    <div class="rim"></div>
    <div class="bulbs" id="bulbs" aria-hidden="true"></div>
    <div class="wheel" id="wheel" role="img" aria-label="八個區域的幸運轉盤"></div>
    <div class="gloss"></div>

    <div class="pointer" aria-hidden="true">
      <svg viewBox="0 0 40 50">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9db9"/><stop offset="1" stop-color="#e5517f"/>
          </linearGradient>
        </defs>
        <path d="M20 48 C20 48 3 28 3 17 A17 17 0 0 1 37 17 C37 28 20 48 20 48Z" fill="url(#pg)" stroke="#fff" stroke-width="3"/>
        <circle cx="20" cy="17" r="6.5" fill="#fff8e3"/>
      </svg>
    </div>

    <button class="hub" id="hub" type="button" aria-label="轉動轉盤">🌟</button>
  </div>

  <button class="go" id="go" type="button">開始轉動</button>
  <p class="count" id="count" aria-live="polite"></p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="msg">
  <div class="card" id="card">
    <div class="confetti" id="confetti"></div>
    <span class="badge" id="badge">今日幸運</span>
    <div class="emoji" id="emoji">🎁</div>
    <p class="msg" id="msg"></p>
    <button class="again" id="again" type="button">再玩一次</button>
  </div>
</div>

<script>
(function () {
  // 八種幸運結果（順序即轉盤上由正上方起順時針排列）
  var PRIZES = [
    { text: "今天會有小驚喜！",       short: "小驚喜",  emoji: "🎁", color: "#FFB3C7" },
    { text: "好運正在靠近你！",       short: "好運",    emoji: "🍀", color: "#FFE6A0" },
    { text: "適合犒賞自己的一天！",   short: "犒賞",    emoji: "🧁", color: "#A8D8FF" },
    { text: "你的笑容會帶來好運！",   short: "笑容",    emoji: "😊", color: "#C3EBD2" },
    { text: "今天適合嘗試新事物！",   short: "新事物",  emoji: "🌈", color: "#E0CCFA" },
    { text: "有人正在默默支持你！",   short: "支持",    emoji: "🤝", color: "#FFCBA8" },
    { text: "放慢腳步也沒關係！",     short: "慢下來",  emoji: "🐢", color: "#FFD9F0" },
    { text: "今天的幸運主角就是你！", short: "主角",    emoji: "👑", color: "#B5E3F7" }
  ];
  var N = PRIZES.length;
  var SEG = 360 / N;
  var TINTS = ["#ff8fb1", "#f2b23a", "#5aa9ff", "#4fc68c", "#a583f0", "#ff9a63", "#f27ac2", "#44b7e6"];

  var wheel = document.getElementById("wheel");
  var stage = document.getElementById("stage");
  var goBtn = document.getElementById("go");
  var hub = document.getElementById("hub");
  var overlay = document.getElementById("overlay");
  var againBtn = document.getElementById("again");
  var countEl = document.getElementById("count");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var rotation = 0;     // 轉盤累積旋轉角度
  var spinning = false;
  var plays = 0;
  var finishTimer = null;

  // ---------- 畫轉盤（SVG） ----------
  function polar(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [r * Math.cos(a), r * Math.sin(a)];
  }
  function buildWheel() {
    var svg = '<svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">';
    svg += '<defs><radialGradient id="shade" cx="50%" cy="50%" r="50%">' +
           '<stop offset="0.35" stop-color="#fff" stop-opacity="0.35"/>' +
           '<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>';
    for (var i = 0; i < N; i++) {
      var a0 = i * SEG - SEG / 2, a1 = i * SEG + SEG / 2;
      var p0 = polar(100, a0), p1 = polar(100, a1);
      svg += '<path d="M0 0 L' + p0[0].toFixed(3) + ' ' + p0[1].toFixed(3) +
             ' A100 100 0 0 1 ' + p1[0].toFixed(3) + ' ' + p1[1].toFixed(3) +
             ' Z" fill="' + PRIZES[i].color + '" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>';
    }
    svg += '<circle r="100" fill="url(#shade)"/>';
    for (var j = 0; j < N; j++) {
      svg += '<g transform="rotate(' + (j * SEG) + ')">' +
             '<text y="-66" font-size="21" text-anchor="middle">' + PRIZES[j].emoji + '</text>' +
             '<text y="-47" font-size="10.5" font-weight="900" text-anchor="middle" fill="#6a3f58" ' +
             'style="font-family:inherit;letter-spacing:.5px">' + PRIZES[j].short + '</text></g>';
    }
    svg += '</svg>';
    wheel.innerHTML = svg;
  }
  function buildBulbs() {
    var wrap = document.getElementById("bulbs");
    var html = "";
    var count = 16;
    for (var i = 0; i < count; i++) {
      var p = polar(47.2, i * (360 / count)); // 以舞台百分比定位
      html += '<i style="left:' + (50 + p[0] - 1.7).toFixed(2) + '%;top:' + (50 + p[1] - 1.7).toFixed(2) + '%"></i>';
    }
    wrap.innerHTML = html;
  }

  // ---------- 隨機 ----------
  function randInt(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  // ---------- 轉動 ----------
  function spin() {
    if (spinning) return;
    spinning = true;
    goBtn.disabled = true;
    goBtn.textContent = "轉動中…";
    hub.disabled = true;
    stage.classList.add("spinning");

    var idx = randInt(N);                                   // 先決定結果
    var jitter = (Math.random() - 0.5) * (SEG * 0.6);       // 在該區域內隨機偏移（不會碰到分隔線）
    var targetMod = ((360 - idx * SEG + jitter) % 360 + 360) % 360;
    var currentMod = ((rotation % 360) + 360) % 360;
    var delta = ((targetMod - currentMod) + 360) % 360;
    var turns = reduceMotion ? 2 : 5 + randInt(3);          // 5~7 圈
    rotation += turns * 360 + delta;

    var duration = reduceMotion ? 1500 : 5200 + randInt(800);
    wheel.style.transition = "transform " + duration + "ms cubic-bezier(.12,.62,.08,1)";
    // 觸發 reflow 確保 transition 生效
    void wheel.offsetWidth;
    wheel.style.transform = "rotate(" + rotation + "deg)";

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      wheel.removeEventListener("transitionend", onEnd);
      clearTimeout(finishTimer);
      stage.classList.remove("spinning");
      showResult(idx);
    }
    function onEnd(e) { if (e.target === wheel && e.propertyName === "transform") finish(); }
    wheel.addEventListener("transitionend", onEnd);
    finishTimer = setTimeout(finish, duration + 150);
  }

  // ---------- 結果 ----------
  function showResult(idx) {
    var p = PRIZES[idx];
    plays++;
    document.getElementById("emoji").textContent = p.emoji;
    document.getElementById("msg").textContent = p.text;
    var badge = document.getElementById("badge");
    badge.textContent = "幸運 " + (idx + 1) + " 號";
    badge.style.setProperty("--tint", TINTS[idx]);
    countEl.textContent = "今天已經轉了 " + plays + " 次";
    launchConfetti();
    overlay.classList.add("show");
    setTimeout(function () { againBtn.focus({ preventScroll: true }); }, 300);
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
  }
  function launchConfetti() {
    if (reduceMotion) return;
    var box = document.getElementById("confetti");
    var colors = ["#ff8fb1", "#ffd36b", "#7cc4ff", "#8be0b0", "#c6a8ff", "#ffb48a"];
    var html = "";
    for (var i = 0; i < 28; i++) {
      html += '<span style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' +
              colors[i % colors.length] + ';animation-duration:' + (1.8 + Math.random() * 1.6).toFixed(2) +
              's;animation-delay:' + (Math.random() * .5).toFixed(2) + 's"></span>';
    }
    box.innerHTML = html;
  }
  function closeAndReset() {
    overlay.classList.remove("show");
    goBtn.disabled = false;
    goBtn.textContent = "開始轉動";
    hub.disabled = false;
    spinning = false;
  }
  function playAgain() {
    closeAndReset();
    setTimeout(spin, 350);
  }

  // ---------- 事件 ----------
  goBtn.addEventListener("click", spin);
  hub.addEventListener("click", spin);
  againBtn.addEventListener("click", playAgain);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeAndReset(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("show")) closeAndReset();
  });

  buildWheel();
  buildBulbs();
})();
</script>
</body>
</html>
